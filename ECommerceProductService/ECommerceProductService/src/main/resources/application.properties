spring.application.name=ECommerceProductService
spring.datasource.url=jdbc:mysql://localhost:3306/ecomproductservice
spring.datasource.username=root
spring.datasource.password=chetan123
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Fake Store API Configuration
fakestore.api.url=https://fakestoreapi.com
fakestore.api.path.product=/product
fakestore.api.path.category=/category

#OAuth2.0 config
server.port=8082
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081

#server.ssl.enabled=true
#server.ssl.key-store=classpath:eCommerceApplication.p12
#server.ssl.key-store-password=eCommerceApplication
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=eCommerceApplication

userservice.api.url=http://EcommerceUserService/auth
userservice.api.path.validate=/validate

logging.level.org.springframework=trace

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# Redis Server Host
spring.data.redis.host=localhost
# Default Redis Port
spring.data.redis.port=6379