spring.application.name=ApiGateway

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Product Service Routes ---
spring.cloud.gateway.routes[0].id=Product
spring.cloud.gateway.routes[0].uri=lb://ECOMMERCEPRODUCTSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.routes[1].id=Category
spring.cloud.gateway.routes[1].uri=lb://ECOMMERCEPRODUCTSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/category/**

spring.cloud.gateway.routes[2].id=Search
spring.cloud.gateway.routes[2].uri=lb://ECOMMERCEPRODUCTSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/search/**

# --- User Service Routes ---
spring.cloud.gateway.routes[3].id=User
spring.cloud.gateway.routes[3].uri=lb://ECOMMERCEUSERSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/user/**

spring.cloud.gateway.routes[4].id=Auth
spring.cloud.gateway.routes[4].uri=lb://ECOMMERCEUSERSERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[5].id=Role
spring.cloud.gateway.routes[5].uri=lb://ECOMMERCEUSERSERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/role/**

# Actuator Configuration
management.endpoints.web.exposure.include=*